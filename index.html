<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraçaMed - Alarme de Medicamentos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }
        
        .btn-senior {
            min-height: 3.5rem;
            touch-action: manipulation;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); }
            70% { transform: scale(1.08); box-shadow: 0 0 0 25px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .alarm-shake {
            animation: pulse-ring 1.2s infinite ease-in-out;
        }

        @keyframes siren-flash {
            0%, 100% { background-color: rgba(220, 38, 38, 0.95); }
            50% { background-color: rgba(30, 58, 138, 0.95); }
        }

        .siren-bg {
            animation: siren-flash 0.8s infinite;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const DEFAULT_MEDICATIONS = [
            {
                id: 'omeprazol-1',
                name: 'Omeprazol Generis 10 mg',
                type: 'capsule',
                typeLabel: 'Cápsulas',
                icon: 'fa-capsules',
                color: 'bg-emerald-600',
                lightColor: 'bg-emerald-50 text-emerald-900 border-emerald-300',
                times: ['10:00'],
                instruction: '1 cápsula em jejum (30 min antes do pequeno-almoço)',
                warning: 'Tomar enquanto durar o tratamento com Lepicortinolo',
                image: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250"><rect width="400" height="250" fill="%2305a04e"/><circle cx="310" cy="120" r="48" fill="%23d672a5"/><text x="310" y="128" fill="white" font-family="sans-serif" font-weight="bold" font-size="22" text-anchor="middle">10mg</text><text x="30" y="70" fill="white" font-family="sans-serif" font-weight="900" font-size="32">Omeprazole</text><text x="30" y="105" fill="white" font-family="sans-serif" font-size="16">Gastro-Resistant Capsules, hard</text><text x="30" y="210" fill="white" font-family="sans-serif" font-size="18" font-weight="bold">28 Hard Capsules</text></svg>',
                calculateDose: (dayNum) => {
                    if (dayNum <= 18) {
                        return { dose: '1 Cápsula em jejum', active: true, text: 'Tomar 30 min antes do pequeno-almoço.' };
                    }
                    return { dose: 'Tratamento Concluído', active: false, text: 'Já não necessita de tomar hoje.' };
                }
            },
            {
                id: 'lepicortinolo-1',
                name: 'Lepicortinolo 20 mg (Prednisolona)',
                type: 'pill',
                typeLabel: 'Comprimidos',
                icon: 'fa-pills',
                color: 'bg-red-600',
                lightColor: 'bg-red-50 text-red-900 border-red-300',
                times: ['08:30'],
                instruction: 'Tomar ao pequeno-almoço conforme a fase de desmame',
                warning: 'Atenção à quantidade reduzida conforme os dias de tratamento',
                image: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250"><rect width="400" height="250" fill="%23ffffff"/><rect x="0" y="0" width="400" height="250" fill="none" stroke="%23cbd5e1" stroke-width="4"/><text x="25" y="75" fill="%230b4269" font-family="sans-serif" font-weight="900" font-size="26">Lepicortinolo® <tspan fill="%23d9232a">20mg</tspan></text><text x="25" y="105" fill="%230b4269" font-family="sans-serif" font-weight="bold" font-size="18">Comprimido</text><text x="25" y="130" fill="%2364748b" font-family="sans-serif" font-size="15">Prednisolona</text><g transform="translate(220, 90)"><rect x="60" y="0" width="40" height="30" fill="%23f87171"/><rect x="30" y="20" width="40" height="30" fill="%23ef4444"/><rect x="0" y="40" width="40" height="30" fill="%23dc2626"/></g><text x="25" y="210" fill="%230b4269" font-family="sans-serif" font-size="15" font-weight="bold">20 Comprimidos</text></svg>',
                calculateDose: (dayNum) => {
                    if (dayNum >= 1 && dayNum <= 6) {
                        return { dose: '1 Comprimido Inteiro', active: true, text: 'Fase 1 (Dias 1 a 6): 1 comprimido ao pequeno-almoço.' };
                    } else if (dayNum >= 7 && dayNum <= 12) {
                        return { dose: 'MEIO Comprimido (1/2)', active: true, text: 'Fase 2 (Dias 7 a 12): Partir ao meio. Tomar 1/2 comprimido.' };
                    } else if (dayNum >= 13 && dayNum <= 18) {
                        return { dose: 'UM QUARTO Comprimido (1/4)', active: true, text: 'Fase 3 (Dias 13 a 18): Partir em 4 partes. Tomar 1/4 comprimido.' };
                    }
                    return { dose: 'Tratamento Concluído', active: false, text: 'O período de desmame já terminou.' };
                }
            },
            {
                id: 'bilaxten-1',
                name: 'Bilaxten 20 mg (Bilastina)',
                type: 'pill',
                typeLabel: 'Comprimidos',
                icon: 'fa-tablets',
                color: 'bg-blue-600',
                lightColor: 'bg-blue-50 text-blue-900 border-blue-300',
                times: ['08:00', '16:00', '00:00'],
                instruction: '1 comprimido de 8 em 8 horas',
                warning: 'Apenas enquanto houver comichão',
                image: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250"><rect width="400" height="250" fill="%23ffffff"/><rect x="0" y="0" width="400" height="250" fill="none" stroke="%23cbd5e1" stroke-width="4"/><rect x="0" y="200" width="400" height="50" fill="%233b82f6"/><text x="25" y="85" fill="%233b1156" font-family="sans-serif" font-weight="900" font-size="32">BILAXTEN®</text><rect x="250" y="55" width="80" height="35" rx="6" fill="%231d4ed8"/><text x="290" y="78" fill="white" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">20 mg</text><line x1="140" y1="100" x2="200" y2="40" stroke="%23eab308" stroke-width="8" stroke-linecap="round"/><text x="25" y="125" fill="%231e3a8a" font-family="sans-serif" font-weight="bold" font-size="16">Comprimido orodispersível</text><text x="25" y="148" fill="%231e3a8a" font-family="sans-serif" font-size="16">bilastina</text><text x="25" y="232" fill="white" font-family="sans-serif" font-size="13">20 comprimidos orodispersíveis</text></svg>',
                calculateDose: (dayNum) => {
                    return { dose: '1 Comprimido', active: true, text: 'Tomar de 8 em 8 horas apenas se mantiver comichão.' };
                }
            },
            {
                id: 'advantan-1',
                name: 'Advantan 1 mg/g (Creme)',
                type: 'cream',
                typeLabel: 'Emulsão / Creme',
                icon: 'fa-pump-medical',
                color: 'bg-sky-600',
                lightColor: 'bg-sky-50 text-sky-900 border-sky-300',
                times: ['09:00', '21:00'],
                instruction: 'Aplicar suavemente nas lesões de pele',
                warning: '⚠️ ATENÇÃO: NÃO APLICAR NO ROSTO!',
                image: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250"><rect width="400" height="250" fill="%23f8fafc"/><rect x="0" y="0" width="400" height="250" fill="none" stroke="%23cbd5e1" stroke-width="4"/><rect x="35" y="90" width="12" height="65" fill="%230284c7"/><rect x="52" y="90" width="12" height="65" fill="%230284c7"/><text x="80" y="115" fill="%230f172a" font-family="sans-serif" font-weight="900" font-size="26">Advantan® 0,1% Creme</text><text x="80" y="142" fill="%23475569" font-family="sans-serif" font-size="15">Methylprednisolonaceponat</text><text x="80" y="195" fill="%230f172a" font-family="sans-serif" font-weight="bold" font-size="18">25 g</text></svg>',
                calculateDose: (dayNum, timeIndex) => {
                    if (dayNum >= 1 && dayNum <= 7) {
                        return { dose: 'Aplicar no corpo (2x ao dia)', active: true, text: 'Primeiros 7 dias: Aplicação de manhã e à noite nas feridas.' };
                    } else if (dayNum >= 8 && dayNum <= 14) {
                        if (timeIndex === 1) {
                            return { dose: 'Não necessário à noite', active: false, text: 'Fase 2 (Seguintes 7 dias): Apenas 1 aplicação por dia (de manhã).' };
                        }
                        return { dose: 'Aplicar no corpo (1x ao dia)', active: true, text: 'Fase 2: Aplicar apenas 1 vez ao dia de manhã nas feridas.' };
                    }
                    return { dose: 'Tratamento Concluído', active: false, text: 'Tratamento de 14 dias concluído.' };
                }
            }
        ];

        function App() {
            const [startDate, setStartDate] = React.useState(() => {
                const saved = localStorage.getItem('gracamed_start_date');
                return saved || new Date().toISOString().split('T')[0];
            });

            const [medications, setMedications] = React.useState(() => {
                const saved = localStorage.getItem('gracamed_meds');
                return saved ? JSON.parse(saved) : DEFAULT_MEDICATIONS;
            });

            const [takenLog, setTakenLog] = React.useState(() => {
                const saved = localStorage.getItem('gracamed_taken_log');
                return saved ? JSON.parse(saved) : {};
            });

            const [currentTime, setCurrentTime] = React.useState(new Date());
            const [triggeredAlarms, setTriggeredAlarms] = React.useState({});
            const [activeAlarm, setActiveAlarm] = React.useState(null);
            const [toastMessage, setToastMessage] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('today');
            const [editingMed, setEditingMed] = React.useState(null);

            // Audio & Device permission state
            const [audioUnlocked, setAudioUnlocked] = React.useState(false);
            const [wakeLockActive, setWakeLockActive] = React.useState(false);
            const [showMobileModal, setShowMobileModal] = React.useState(false);
            const [notificationPermission, setNotificationPermission] = React.useState(
                typeof Notification !== 'undefined' ? Notification.permission : 'unsupported'
            );

            const audioCtxRef = React.useRef(null);
            const wakeLockRef = React.useRef(null);
            const sirenIntervalRef = React.useRef(null);
            const speechIntervalRef = React.useRef(null);

            const startAlarmAudioLoop = (medName, dose) => {
                // Ensure previous siren is cleared
                stopAlarmAudioLoop();

                const playSirenTone = () => {
                    try {
                        if (!audioCtxRef.current) {
                            const AudioCtx = window.AudioContext || window.webkitAudioContext;
                            if (AudioCtx) audioCtxRef.current = new AudioCtx();
                        }
                        const ctx = audioCtxRef.current;
                        if (ctx) {
                            if (ctx.state === 'suspended') {
                                ctx.resume();
                            }
                            
                            const now = ctx.currentTime;
                            const osc1 = ctx.createOscillator();
                            const osc2 = ctx.createOscillator();
                            const gain = ctx.createGain();

                            osc1.type = 'sawtooth';
                            osc2.type = 'sine';

                            // Dual siren frequency sweep (high urgent beep)
                            osc1.frequency.setValueAtTime(880, now);
                            osc1.frequency.exponentialRampToValueAtTime(440, now + 0.35);

                            osc2.frequency.setValueAtTime(587.33, now);
                            osc2.frequency.exponentialRampToValueAtTime(880, now + 0.35);

                            gain.gain.setValueAtTime(0.8, now);
                            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

                            osc1.connect(gain);
                            osc2.connect(gain);
                            gain.connect(ctx.destination);

                            osc1.start(now);
                            osc2.start(now);
                            osc1.stop(now + 0.5);
                            osc2.stop(now + 0.5);
                        }
                    } catch (e) {
                        console.error('Audio siren error:', e);
                    }
                };

                // Play tone immediately and repeat every 700ms
                playSirenTone();
                sirenIntervalRef.current = setInterval(playSirenTone, 700);

                // Mobile vibration pulse loop
                if ('vibrate' in navigator) {
                    navigator.vibrate([800, 200, 800, 200, 1000]);
                }

                // Repeated Voice Speech
                const speakAnnouncement = () => {
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                        const announcement = `Atenção Graça! Está na hora do medicamento: ${medName}. Quantidade: ${dose}. Por favor confirme a toma na aplicação.`;
                        const utterance = new SpeechSynthesisUtterance(announcement);
                        utterance.lang = 'pt-PT';
                        utterance.rate = 0.88;
                        utterance.pitch = 1.0;
                        window.speechSynthesis.speak(utterance);
                    }
                };

                speakAnnouncement();
                // Repeat spoken voice every 8 seconds until stopped
                speechIntervalRef.current = setInterval(speakAnnouncement, 8000);
            };

            const stopAlarmAudioLoop = () => {
                if (sirenIntervalRef.current) {
                    clearInterval(sirenIntervalRef.current);
                    sirenIntervalRef.current = null;
                }
                if (speechIntervalRef.current) {
                    clearInterval(speechIntervalRef.current);
                    speechIntervalRef.current = null;
                }
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
                if ('vibrate' in navigator) {
                    navigator.vibrate(0);
                }
            };

            const setupPhonePermissions = async () => {
                // 1. Unlock Web Audio Context
                try {
                    if (!audioCtxRef.current) {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (AudioCtx) audioCtxRef.current = new AudioCtx();
                    }
                    if (audioCtxRef.current && audioCtxRef.current.state === 'suspended') {
                        await audioCtxRef.current.resume();
                    }
                    setAudioUnlocked(true);
                } catch(e) {
                    console.log('Audio error:', e);
                }

                // 2. Request System Notifications
                if ('Notification' in window) {
                    try {
                        const perm = await Notification.requestPermission();
                        setNotificationPermission(perm);
                    } catch (e) {
                        console.log('Notification error:', e);
                    }
                }

                // 3. Request Wake Lock (Keep screen on)
                try {
                    if ('wakeLock' in navigator && !wakeLockActive) {
                        wakeLockRef.current = await navigator.wakeLock.request('screen');
                        setWakeLockActive(true);
                    }
                } catch(e) {
                    console.log('WakeLock error:', e);
                }

                // Play test chime and confirmation
                speakText('Telemóvel configurado com sucesso! Os alarmes de som estão ativos.');
                showToast('✅ Som, Notificações e Telemóvel Autorizados com Sucesso!');
            };

            const toggleWakeLock = async () => {
                try {
                    if (!wakeLockActive && 'wakeLock' in navigator) {
                        wakeLockRef.current = await navigator.wakeLock.request('screen');
                        setWakeLockActive(true);
                        showToast('💡 Ecrã do telemóvel configurado para não apagar.');
                    } else if (wakeLockRef.current) {
                        await wakeLockRef.current.release();
                        wakeLockRef.current = null;
                        setWakeLockActive(false);
                        showToast('🌙 Ecrã em modo normal.');
                    }
                } catch (err) {
                    showToast('⚠️ O seu dispositivo não suporta manter o ecrã sempre aceso.');
                }
            };

            const speakText = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'pt-PT';
                    utterance.rate = 0.88;
                    window.speechSynthesis.speak(utterance);
                }
            };

            const getTreatmentDay = () => {
                if (!startDate) return 1;
                const start = new Date(startDate);
                const today = new Date();
                start.setHours(0,0,0,0);
                today.setHours(0,0,0,0);
                const diffTime = today - start;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
                return diffDays > 0 ? diffDays : 1;
            };

            const treatmentDay = getTreatmentDay();
            const todayStr = new Date().toISOString().split('T')[0];

            React.useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    setCurrentTime(now);

                    const currentHHMM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                    const todayKey = now.toISOString().split('T')[0];

                    medications.forEach(med => {
                        med.times.forEach((timeStr, idx) => {
                            if (timeStr === currentHHMM) {
                                const alarmKey = `${todayKey}_${med.id}_${timeStr}`;
                                if (!triggeredAlarms[alarmKey] && !takenLog[alarmKey]) {
                                    setTriggeredAlarms(prev => ({ ...prev, [alarmKey]: true }));
                                    triggerAlarm(med, timeStr, idx);
                                }
                            }
                        });
                    });

                }, 1000);

                return () => clearInterval(timer);
            }, [medications, takenLog, triggeredAlarms]);

            React.useEffect(() => {
                localStorage.setItem('gracamed_start_date', startDate);
            }, [startDate]);

            React.useEffect(() => {
                localStorage.setItem('gracamed_meds', JSON.stringify(medications));
            }, [medications]);

            React.useEffect(() => {
                localStorage.setItem('gracamed_taken_log', JSON.stringify(takenLog));
            }, [takenLog]);

            const triggerPushNotification = (medName, dose) => {
                if ('Notification' in window && Notification.permission === 'granted') {
                    try {
                        new Notification(`🚨 Hora de Tomar Medicamento - GraçaMed`, {
                            body: `Medicamento: ${medName}\nDose: ${dose}`,
                            icon: 'https://cdn-icons-png.flaticon.com/512/883/883407.png',
                            requireInteraction: true,
                            vibrate: [500, 200, 500, 200, 1000]
                        });
                    } catch(e) {
                        console.log('Push notification failed:', e);
                    }
                }
            };

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 4500);
            };

            const triggerAlarm = (med, timeStr, timeIndex = 0) => {
                const dayNum = treatmentDay;
                const doseInfo = med.calculateDose ? med.calculateDose(dayNum, timeIndex) : { dose: '1 toma', text: med.instruction };
                
                // Push System Notification
                triggerPushNotification(med.name, doseInfo.dose);

                const alarmData = {
                    med,
                    timeStr,
                    doseInfo,
                    dayNum
                };
                setActiveAlarm(alarmData);

                // START CONTINUOUS AUDIO & SIREN & VOICE LOOP
                startAlarmAudioLoop(med.name, doseInfo.dose);
            };

            const handleDismissAlarm = (isTaken) => {
                stopAlarmAudioLoop();
                if (activeAlarm) {
                    if (isTaken) {
                        handleToggleTaken(activeAlarm.med.id, activeAlarm.timeStr);
                    } else {
                        showToast('⏰ Alarme adiado por 5 minutos.');
                        speakText('Alarme adiado.');
                    }
                }
                setActiveAlarm(null);
            };

            const handleToggleTaken = (medId, timeSlot) => {
                const key = `${todayStr}_${medId}_${timeSlot}`;
                const newState = !takenLog[key];
                
                setTakenLog(prev => ({
                    ...prev,
                    [key]: newState
                }));

                if (newState) {
                    showToast('✅ Medicamento marcado como tomado com sucesso!');
                    speakText('Muito bem, Graça! Registado como tomado.');
                }
            };

            const handleUpdateTimeSlot = (medId, timeIndex, newTime) => {
                setMedications(prev => prev.map(m => {
                    if (m.id === medId) {
                        const newTimes = [...m.times];
                        newTimes[timeIndex] = newTime;
                        return { ...m, times: newTimes };
                    }
                    return m;
                }));
                showToast('⏰ Horário atualizado com sucesso!');
            };

            const handleAddTimeSlot = (medId) => {
                setMedications(prev => prev.map(m => {
                    if (m.id === medId) {
                        return { ...m, times: [...m.times, '12:00'] };
                    }
                    return m;
                }));
            };

            const handleRemoveTimeSlot = (medId, timeIndex) => {
                setMedications(prev => prev.map(m => {
                    if (m.id === medId && m.times.length > 1) {
                        const newTimes = m.times.filter((_, idx) => idx !== timeIndex);
                        return { ...m, times: newTimes };
                    }
                    return m;
                }));
            };

            const getDailyProgress = () => {
                let total = 0;
                let done = 0;

                medications.forEach(med => {
                    med.times.forEach((timeStr, idx) => {
                        const doseInfo = med.calculateDose ? med.calculateDose(treatmentDay, idx) : { active: true };
                        if (doseInfo.active !== false) {
                            total++;
                            if (takenLog[`${todayStr}_${med.id}_${timeStr}`]) {
                                done++;
                            }
                        }
                    });
                });

                return { total, done, percent: total > 0 ? Math.round((done / total) * 100) : 0 };
            };

            const progress = getDailyProgress();

            const handleShareSchedule = () => {
                let shareContent = `📋 *PLANO DE MEDICAÇÃO DA GRAÇA*\n`;
                shareContent += `🗓️ Dia do Tratamento: Dia ${treatmentDay} (Início: ${startDate})\n`;
                shareContent += `------------------------------------\n`;

                medications.forEach(med => {
                    shareContent += `\n💊 *${med.name}*\n`;
                    med.times.forEach((time, idx) => {
                        const doseInfo = med.calculateDose ? med.calculateDose(treatmentDay, idx) : { dose: med.instruction, active: true };
                        const isTaken = takenLog[`${todayStr}_${med.id}_${time}`] ? '✅ [TOMADO]' : '⏰ [PENDENTE]';
                        if (doseInfo.active !== false) {
                            shareContent += `   • ${time} hrs - ${doseInfo.dose} ${isTaken}\n`;
                        }
                    });
                    if (med.warning) shareContent += `   ⚠️ Nota: ${med.warning}\n`;
                });

                shareContent += `\n------------------------------------\nEnviado através da app GraçaMed 💙`;

                const textarea = document.createElement('textarea');
                textarea.value = shareContent;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('📋 Plano copiado! Pode colar no WhatsApp/Mensagens.');
                    speakText('Plano de medicação copiado!');
                } catch (err) {
                    showToast('Não foi possível copiar automaticamente.');
                }
                document.body.removeChild(textarea);
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col shadow-2xl relative border-x border-slate-200 pb-20">
                    
                    {}
                    <header className="bg-gradient-to-r from-blue-800 via-sky-800 to-blue-900 text-white p-5 rounded-b-3xl shadow-xl sticky top-0 z-30">

                                        <i className="fa-solid fa-mobile-retro text-xl"></i>
                                        <span>Garantir Alarme no Android e iOS</span>
                                    </div>
                                    <button onClick={() => setShowMobileModal(false)} className="text-slate-400 text-lg font-bold">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="space-y-3 text-xs font-semibold text-slate-700 leading-relaxed">
                                    <div className="bg-amber-50 p-3 rounded-2xl border border-amber-200">
                                        <p className="font-extrabold text-amber-900 mb-1">1. Clique no Botão Laranja de Autorizar</p>
                                        <p className="text-slate-600">O Android e o iPhone bloqueiam sons automáticos. Ao clicar no botão grande de autorização na página inicial, ativa a sirene contínua.</p>
                                    </div>

                                    <div className="bg-blue-50 p-3 rounded-2xl border border-blue-200">
                                        <p className="font-extrabold text-blue-900 mb-1">2. Ative "Manter Ecrã Aceso"</p>
                                        <p className="text-slate-600">No topo da app, mantenha o botão <b>"Manter Ecrã Aceso"</b> ativo para evitar que o telemóvel suspenda o relógio do navegador.</p>
                                    </div>

                                    <div className="bg-emerald-50 p-3 rounded-2xl border border-emerald-200">
                                        <p className="font-extrabold text-emerald-900 mb-1">3. Verifique o Modo Silencioso (iPhone)</p>
                                        <p className="text-slate-600">Certifique-se de que o interruptor lateral de silêncio do iPhone não está no vermelho.</p>
                                    </div>

                                    <div className="bg-slate-100 p-3 rounded-2xl border border-slate-200">
                                        <p className="font-extrabold text-slate-900 mb-1">4. Adicionar ao Ecrã Principal</p>
                                        <p className="text-slate-600">No menu do Safari ou Chrome (3 pontos ou ícone Partilhar), escolha <b>"Adicionar ao Ecrã Principal"</b> para funcionar como uma aplicação instalada.</p>
                                    </div>
                                </div>

                                <button 
                                    onClick={() => setShowMobileModal(false)}
                                    className="w-full bg-slate-900 hover:bg-slate-800 text-white font-black py-3 rounded-2xl text-xs shadow-md"
                                >
                                    Entendi, fechar ajuda
                                </button>
                            </div>
                        </div>
                    )}

                    {}
                    {/* PERSISTENT FULL-SCREEN ALARM OVERLAY */}
                    {activeAlarm && (
                        <div className="fixed inset-0 z-50 siren-bg backdrop-blur-md p-4 flex items-center justify-center overflow-y-auto">
                            <div className="bg-white border-4 border-red-600 rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-5 alarm-shake relative my-auto">
                                
                                <div className="text-center space-y-2">
                                    <div className="inline-flex items-center justify-center w-20 h-20 rounded-full bg-red-100 text-red-600 text-4xl pulse-ring border-4 border-red-500 shadow-lg">
                                        <i className="fa-solid fa-bell animate-bounce"></i>
                                    </div>
                                    <h2 className="text-2xl font-black text-red-600 uppercase tracking-tight">
                                        🚨 HORA DO MEDICAMENTO!
                                    </h2>
                                    <p className="text-xs font-extrabold text-slate-500">
                                        Horário Agendado: <span className="text-slate-900 bg-amber-200 px-2.5 py-1 rounded-lg text-sm">{activeAlarm.timeStr}</span>
                                    </p>
                                </div>

                                <div className="bg-slate-50 border-2 border-slate-200 rounded-3xl p-4 text-center space-y-3">
                                    <h3 className="text-2xl font-black text-slate-900 leading-tight">
                                        {activeAlarm.med.name}
                                    </h3>

                                    <div className="bg-amber-300 border-2 border-amber-500 text-slate-950 p-3.5 rounded-2xl shadow-inner">
                                        <span className="text-xs uppercase font-black tracking-wider text-slate-700 block">Quantidade a tomar agora:</span>
                                        <span className="text-2xl font-black text-slate-950 block mt-0.5">
                                            {activeAlarm.doseInfo.dose}
                                        </span>
                                    </div>

                                    <div className="rounded-2xl overflow-hidden border-2 border-slate-300 bg-white">
                                        <img 
                                            src={activeAlarm.med.image} 
                                            alt={activeAlarm.med.name} 
                                            className="w-full h-48 object-cover"
                                            onError={(e) => {
                                                e.target.src = 'https://placehold.co/400x250/64748b/ffffff?text=Embalagem+do+Medicamento';
                                            }}
                                        />
                                    </div>

                                    {activeAlarm.med.warning && (
                                        <div className="bg-red-100 border-2 border-red-400 text-red-900 p-3 rounded-2xl text-xs font-black text-left flex items-start gap-2">
                                            <i className="fa-solid fa-triangle-exclamation text-red-600 text-lg flex-shrink-0 mt-0.5"></i>
                                            <span>{activeAlarm.med.warning}</span>
                                        </div>
                                    )}
                                </div>

                                <div className="space-y-3">
                                    <button 
                                        onClick={() => handleDismissAlarm(true)}
                                        className="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-black text-xl py-5 rounded-3xl shadow-xl flex items-center justify-center gap-3 border-b-4 border-emerald-800 btn-senior transition-all"
                                    >
                                        <i className="fa-solid fa-circle-check text-3xl"></i>
                                        JÁ TOMEI O MEDICAMENTO
                                    </button>

                                    <button 
                                        onClick={() => handleDismissAlarm(false)}
                                        className="w-full bg-slate-200 hover:bg-slate-300 active:scale-95 text-slate-800 font-extrabold text-sm py-3.5 rounded-2xl flex items-center justify-center gap-2 btn-senior"
                                    >
                                        <i className="fa-solid fa-clock text-slate-600"></i>
                                        Lembrar Mais Tarde (Adiar)
                                    </button>
                                </div>

                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
